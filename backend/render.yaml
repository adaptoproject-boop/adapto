# Render Blueprint — Backend Web Service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: adaptive-elearning-api
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5612
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
